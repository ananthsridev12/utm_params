name: Deploy to cPanel (utm.easi7.in)

# Deploys this repo to the utm.easi7.in cPanel hosting account over FTP/FTPS
# whenever main is updated, or on demand from the Actions tab.
#
# One-time setup before this workflow can run:
#
# 1. In cPanel, create the subdomain (or addon domain) for utm.easi7.in if you
#    haven't already: cPanel -> Domains -> Create A New Domain.
#
# 2. Decide where the app lives on the server, e.g. ~/utm.easi7.in/ (cPanel's
#    default for a new subdomain). This workflow uploads the WHOLE repo there
#    (app/, config/, database/, public/, ...) -- not just public/ -- because
#    public/index.php expects app/, config/ and database/ one level above it.
#
# 3. In cPanel -> Domains, edit utm.easi7.in and set its Document Root to
#    the "public" subfolder of wherever you deployed to, e.g.:
#      utm.easi7.in/public
#    This is what keeps app/, config/ and database/ outside the web-servable
#    path -- the recommended, more secure layout from the README. (If your
#    host truly cannot set a custom document root, deploy to server-dir "./"
#    at the domain's web root instead and rely on the included root
#    .htaccess fallback -- see README.md "Deploying on shared hosting".)
#
# 4. Upload config/config.php to the server ONCE, by hand (FTP/File Manager),
#    copied from config/config.sample.php with your real DB credentials.
#    It's git-ignored on purpose and is never touched by this workflow, so
#    your production credentials are never written into the repo or CI logs.
#
# 5. Import database/schema.sql into your MySQL database once via phpMyAdmin
#    (see README.md). This workflow does not touch the database.
#
# 6. Add these repository secrets under Settings -> Secrets and variables ->
#    Actions -> New repository secret:
#      FTP_SERVER    e.g. ftp.easi7.in (cPanel -> FTP Accounts shows the host)
#      FTP_USERNAME  the FTP account username (create a dedicated FTP account
#                    scoped to the utm.easi7.in folder rather than using the
#                    main cPanel login)
#      FTP_PASSWORD  that FTP account's password
#    Optionally add a repository VARIABLE (Settings -> ... -> Variables):
#      CPANEL_SERVER_DIR  the remote path to deploy into, matching step 2/3,
#                         e.g. utm.easi7.in/ -- defaults to utm.easi7.in/ below.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cpanel-utm-easi7-in
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy to cPanel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://utm.easi7.in
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP syntax
        run: |
          find app public -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.CPANEL_SERVER_DIR || 'utm.easi7.in/' }}
          # Never touch the server's real config, logs, or VCS metadata.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            config/config.php
            storage/logs/**
            **/.DS_Store
          # Only remove files on the server that are also gone from this repo
          # (never a hard wipe-and-reupload of the whole target directory).
          dangerous-clean-slate: false
